version: 2

build:
  os: ubuntu-22.04
  tools:
    python: "3.10"

  jobs:
    post_create_environment:
      # Install uv
      # https://docs.astral.sh/uv/
      - pip install uv
    post_install:
      # Install dependencies with the dev dependency group (which carries sphinx + theme).
      # VIRTUAL_ENV needs to be set manually for now.
      # See https://github.com/readthedocs/readthedocs.org/pull/11152/
      - VIRTUAL_ENV=$READTHEDOCS_VIRTUALENV_PATH uv sync --group dev --active
